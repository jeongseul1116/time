/* 보고 있는 날에서 내 일정이 없는 첫 시간 */
function openHour(dt){
  const mine = eventsForDate(dt).filter(e => e.w.indexOf("me") >= 0);
  for(let h = START_H; h < END_H; h++){
    if(h >= LUNCH[0] && h < LUNCH[1]) continue;
    if(!mine.some(e => e.s < h + 1 && e.e > h)) return h;
  }
  return 10;
}

function placePop(anchor){
  pop.classList.add("on");
  /* 아직 안 만든 기능은 조용히 알려만 준다 */
  setTimeout(() => pop.querySelectorAll("[data-soon]").forEach(b => {
    b.onclick = () => { closePop(); toast(b.dataset.soon + "은 프로토타입에서 지원하지 않습니다."); };
  }), 0);
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = r.right + 10;
  if(left + w > window.innerWidth - 12) left = r.left - w - 10;
  if(left < 12) left = 12;
  let top = r.top - 8;
  if(top + h > window.innerHeight - 12) top = window.innerHeight - h - 12;
  if(top < 12) top = 12;
  pop.style.left = left + "px";
  pop.style.top = top + "px";
  document.getElementById("popClose").onclick = closePop;
}
function closePop(){ pop.classList.remove("on"); }
document.addEventListener("click", e => { if(!e.target.closest("#pop")) closePop(); });

/* ===================== 스캔 로직 ===================== */
function busyEvent(personId, d, s, e){
  return scanEvents().find(ev => ev.d === d && ev.w.indexOf(personId) >= 0 && ev.s < e && ev.e > s);
}

function computeSlots(){
  /* 주최자가 참석할 때만 그의 일정을 계산에 넣는다 */
  const req = required().map(a => a.id);
  if(state.hostJoins && req.indexOf("me") < 0) req.push("me");
  const opt = optional().map(a => a.id);
  const found = [];
  state.blockedCount = 0;
  state.blockedDays = [];

  const ad = allDayOf(0);
  const dayBlock = d => ad.find(a => a.d === d && a.block === "all");
  const personBlock = (d, id) => ad.find(a => a.d === d && a.block === id);

  for(let d = 0; d < 5; d++){
    /* 전사 워크숍 같은 날은 시간대를 따질 것도 없다 */
    const db = dayBlock(d);
    if(db){ state.blockedDays.push({ d, t:db.t }); continue; }

    for(let s = START_H; s + 1 <= END_H; s += 0.5){
      const e = s + 1;
      if(s < LUNCH[1] && e > LUNCH[0]) continue;            /* 점심시간 제외 */

      const rc = [], oc = [], hard = [];
      req.forEach(id => {
        const pb = personBlock(d, id);
        if(pb){ hard.push({ who:id, block:pb.t, k:null, m:"fixed" }); return; }
        const ev = busyEvent(id, d, s, e);
        if(!ev) return;
        const m = mobility(ev);
        const c = { who:id, block:ev.t, k:ev._k, m };
        /* 상대가 있어 보이는 일정 — 어려워 보일 뿐, 아직 물어본 적은 없다 */
        if(m === "fixed") hard.push(c); else rc.push(c);
      });
      opt.forEach(id => {
        const pb = personBlock(d, id);
        if(pb){ oc.push({ who:id, block:pb.t, k:null, m:"fixed" }); return; }
        const ev = busyEvent(id, d, s, e);
        if(ev) oc.push({ who:id, block:ev.t, k:ev._k, m:mobility(ev) });
      });

      const all = rc.concat(hard);
      let rank = null;
      if(!hard.length){
        if(rc.length === 0) rank = oc.length === 0 ? 1 : 2;
        else if(rc.length === 1) rank = 3;
        else if(rc.length === 2) rank = 4;
      }else if(all.length <= 2){
        /* 「고객사 방문」처럼 어려워 보이는 자리도 지우지 않는다.
           화면만 보고 안 된다고 결론 내리는 것이 원래 문제였다.
           맨 뒤 후보로 남겨, 물어볼지 말지는 주최자가 정한다. */
        rank = 5;
      }
      /* 물어볼 사람이 셋 넘게 생기는 자리만 후보에서 뺀다 */
      if(!rank){ state.blockedCount++; continue; }

      /* 점심 직후 — 회의는 열리지만 결정의 질이 떨어진다 */
      const lowFocus = s < LOW_FOCUS[1] && e > LOW_FOCUS[0];
      found.push({ d, s, e, rank, lowFocus, conflicts:all, optConflicts:oc });
    }
  }

  /* 같은 순위면 집중이 잘 되는 시간을 먼저 */
  found.sort((a,b) => a.rank - b.rank || (a.lowFocus ? 1 : 0) - (b.lowFocus ? 1 : 0)
    || a.d - b.d || a.s - b.s);

  /* 같은 시간대가 겹치면 하나만, 순위당 최대 3칸, 전체 최대 6칸 */
  const picked = [], perRank = {};
  found.forEach(f => {
    if(picked.length >= 6) return;
    if((perRank[f.rank] || 0) >= 3) return;
    if(picked.some(p => p.d === f.d && p.s < f.e && p.e > f.s)) return;
    picked.push(f);
    perRank[f.rank] = (perRank[f.rank] || 0) + 1;
  });
  picked.sort((a,b) => a.rank - b.rank || a.d - b.d || a.s - b.s);
  return picked;
}

/* ===================== 헬퍼 ===================== */
const required = () => state.attendees.filter(a => a.need === "required");
const optional = () => state.attendees.filter(a => a.need === "optional");
const hasHard  = () => state.attendees.some(a => P(a.id) && P(a.id).hardToReschedule);
const hasTopRank = () => state.slots.some(s => s.rank <= 2);
const fmt = sl => "8/" + DATES[sl.d] + "(" + DAYS[sl.d] + ") " + hhmm(sl.s) + "–" + hhmm(sl.e);
function hhmm(h){
  const H = Math.floor(h + 1e-9), M = Math.round((h - H) * 60);
  return String(H).padStart(2,"0") + ":" + String(M).padStart(2,"0");
}
function avatar(p, size){
  size = size || 30;
  return '<span class="avatar" style="background:' + p.color + ';color:' + p.ink +
    ';width:' + size + 'px;height:' + size + 'px;font-size:' + (size < 26 ? 10 : 12) + 'px">' +
    p.name.slice(0,1) + '</span>';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
}

/* ===================== 링크 분석 ===================== */
function startAnalyze(url, label){
  url = (url || "").trim();
  if(!url) return;
  state.analyzing = { kind:detectKind(url), url, label:label || null, step:0 };
  render();
  const fx = LINK_FIXTURES[state.analyzing.kind];
  const tick = () => {
    if(!state.analyzing) return;
    if(state.analyzing.step >= fx.steps.length){ applyAnalysis(); return; }
    state.analyzing.step++;
    const bar = document.querySelector(".analyzing .bar i");
    const lines = document.querySelectorAll(".an-line");
    if(lines[state.analyzing.step - 1]) lines[state.analyzing.step - 1].classList.add("on");
    if(bar) bar.style.width = (state.analyzing.step / fx.steps.length * 100) + "%";
    setTimeout(tick, 520);
  };
  setTimeout(tick, 260);
}
function applyAnalysis(){
  const { kind, url, label } = state.analyzing;
  const fx = LINK_FIXTURES[kind];
  state.source = { kind, url, icon:fx.icon, label:label || fx.label, summary:fx.summary };
  if(!state.title.trim()) state.title = fx.title;
  fx.people.forEach(sp => {
    const cur = state.attendees.find(a => a.id === sp.id);
    if(cur){
      if(!cur.edited) Object.assign(cur, sp, { auto:true });
    }else{
      state.attendees.push(Object.assign({}, sp, { auto:true }));
    }
  });
  state.analyzing = null;
  syncCalWithAttendees();
  save(); render();
}
function clearSource(){
  /* 링크를 떼면 AI가 넣은 사람은 빠지고, 주최자가 손댄 사람만 남는다 */
  state.source = null;
  state.attendees = state.attendees.filter(a => !a.auto || a.edited);
  syncCalWithAttendees();
  save(); render();
}

}

      '<div class="ed-on">' + me.name +
        '<i class="ed-dot" style="background:' + me.color + '"></i></div>' +
      '<button class="ed-add ed-status" id="edOpts">' + statusLine(d) +

      (d.optsOpen
        ? '<div class="ed-opts">' +
            optRow("표시", "busy", [[1,"바쁨"],[0,"한가함"]], d.busy === false ? 0 : 1) +
            optRow("공개 설정", "vis", [["def","기본"],["pub","공개"],["priv","비공개"]], d.vis || "def") +
            optRow("알림", "rem", [[10,"10분"],[30,"30분"],[60,"1시간"],[0,"없음"]], remOf(d)) +
          '</div>'
        : ''));

  foot.innerHTML =
    '<button class="btn ghost" id="edCancel">취소</button><div style="flex:1"></div>' +
    '<button class="btn primary" id="edSave">저장</button>';

  const ti = document.getElementById("edTitle");
  ti.oninput = () => { state.title = ti.value; save(); };
  ti.onkeydown = e => { if(e.key === "Enter") saveDraft(); };

  if(!d.focused){ d.focused = true; ti.focus(); }

  body.querySelectorAll("[data-dur]").forEach(b => {

      d.e = Math.min(d.s + +b.dataset.dur, END_H);

      render();
    };
  });
  document.getElementById("edPeople").onclick = () => switchMode(1);

  body.querySelectorAll("[data-on]").forEach(b => {
    b.onclick = () => {
      d.meet = true;
      d.meetCode = meetCode(d.key + d.s);
      render();
    };
  });
  body.querySelectorAll("[data-off]").forEach(b => {
    b.onclick = () => {
      if(b.dataset.off === "meet") d.meet = false;
      else { d.roomId = null; d.roomOpen = false; }
      render();
    };
  });
  body.querySelectorAll("[data-show]").forEach(b => {
    b.onclick = () => { d["show" + (b.dataset.show === "loc" ? "Loc" : "Desc")] = true; render(); };
  });

  /* 바쁨 / 공개 설정 / 알림 */
  document.getElementById("edOpts").onclick = () => { d.optsOpen = !d.optsOpen; render(); };
  body.querySelectorAll("[data-busy]").forEach(b => {
    b.onclick = () => { d.busy = b.dataset.busy === "1"; render(); };
  });
  body.querySelectorAll("[data-vis]").forEach(b => {
    b.onclick = () => { d.vis = b.dataset.vis; render(); };
  });

  });

  if(er) er.onclick = () => { d.roomOpen = true; render(); };
  bindRooms(body, id => {
    d.roomId = id === "none" ? null : id;
    d.roomOpen = false;
    render();
  });

  const lo = document.getElementById("edLoc");
  if(lo){
    lo.oninput = () => { d.loc = lo.value; };

  if(de){
    de.oninput = () => { d.desc = de.value; };
    if(d.showDesc === true){ d.showDesc = "on"; de.focus(); }
  }

  document.getElementById("edCancel").onclick = closeSheet;
  document.getElementById("edSave").onclick = saveDraft;
}

function saveDraft(){
  const d = state.draft;
  const t = (state.title || "").trim() || "제목 없음";
  const room = d.roomId ? ROOMS.filter(r => r.id === d.roomId)[0] : null;
  state.userEvents.push({
    key:d.key, d:d.d, s:d.s, e:d.e, t, w:["me"],
    _k:"u" + Date.now(),
    meet:!!d.meet, roomId:d.roomId || null,
    loc:d.loc || "", desc:d.desc || "",
    busy:d.busy !== false, vis:d.vis || "def", remind:remOf(d),
  });
  persist();
  closeSheet();
  toast('「' + t + '」 일정을 만들었습니다.' + (room ? " · " + room.n : ""));
}

/* --------- 2. 스캔 --------- */
function startScan(){
  onbMark("scan");
  state.step = 2;
  state.selectedSlot = null;
  state.room = null; state.roomOpen = false;
  state.dropped = null; state.exhausted = false;
  state.slots = computeSlots();
  if(state.view !== "week" || weekOff() !== 0){ state.view = "week"; paintViewBtn(); gotoWeek(0); }
  render();
  setTimeout(() => {
    if(state.step !== 2) return;
    if(!state.slots.length){ state.selectedSlot = null; state.step = 3; render(); return; }
    /* 고르는 것도 보내는 것도 AI가 한다 — 주최자는 결과를 보고 되돌린다 */
    onbMark("send");
    proposeSlot(0);
  }, 1500);
}

/* 후보 하나를 제안한다 — 전원 비면 확정 초대, 아니면 겹친 한 명에게만 요청 */
function proposeSlot(i){
  const sl = state.slots[i];
  if(!sl) return;
  const rm = (state.selectedSlot = i, pickedRoom(sl));
  state.sent = sl.rank <= 2 ? "invite" : "ask";
  state.holdAnswer = null;
  state.reminders = 0;
  state.hold = {
    d:sl.d, s:sl.s, e:sl.e, rank:sl.rank, confirmed:sl.rank <= 2,
    title:state.title, people:headCount(),
    att:(state.hostJoins ? [{ id:"me", need:"host" }] : []).concat(
      state.attendees.map(a => ({ id:a.id, need:a.need }))),
    askers:sl.conflicts.map(c => P(c.who).name),
    room:rm ? rm.n : null, roomId:rm ? rm.id : null,
  };
  state.step = 4;
  persist(); syncGrid(); paintCandidates();
  if(state.sheetOpen) render();
  if(!state.hold.confirmed) scheduleReply();   /* 물어봤으니 답이 온다 */
}

function renderScan(){
  title.textContent = "가능한 일정 찾는 중";
  sub.textContent = "";
  body.innerHTML =
    '<div class="scan"><div class="spin"></div>' +
      '<p>다음 주 평일에서 잡을 수 있는 시간을 찾고 있습니다.</p></div>';
  foot.innerHTML = '<div style="flex:1"></div>';
}

/* --------- 회의실 --------- */
/* 방에 들어갈 사람 수 — 주최자가 빠지면 한 명 줄어든다 */
function headCount(){ return state.attendees.length + (state.hostJoins ? 1 : 0); }

/* 지금 잡혀 있는 방 — 주최자가 고르지 않았으면 자동으로 잡힌 방 */
function pickedRoom(sl){
  if(state.room === "none") return null;
  const list = roomStatus(sl.d, sl.s, sl.e, headCount());
  if(state.room){
    const r = list.filter(x => x.id === state.room)[0];
    if(r && !r.busy) return r;
  }
  return list.filter(x => !x.busy && x.fits)[0] || null;
}

/* 그 시간에 쓸 수 있는 방을 그대로 보여준다 — 찬 방도 왜 못 쓰는지까지 */
function roomsHTML(sl, people, curId, autoTag){
  const list = roomStatus(sl.d, sl.s, sl.e, people);
  const free = list.filter(r => !r.busy && r.fits);
  const cur = curId && curId !== "none" ? { id:curId } : null;

  const rows = list.map(r => {
    const off = !!r.busy || !r.fits;
    const st = r.busy
      ? '<span class="room-st busy">「' + esc(r.busy) + '」 사용 중</span>'
      : !r.fits
      ? '<span class="room-st">' + people + '명은 못 들어감</span>'
      : '<span class="room-st ok">비어 있음</span>';
    return '<button class="room-row' + (cur && cur.id === r.id ? " on" : "") + '"' +
      (off ? " disabled" : ' data-room="' + r.id + '"') + '>' +
      '<span class="room-mark">✓</span>' +
      '<span class="room-n">' + r.n + '<span class="room-cap">' + r.cap + '인</span></span>' +
      st + '</button>';
  }).join("");

  return '<div class="rooms"><div class="rooms-h">' +
      '<span class="t">회의실</span>' +
      '<span class="c">' + (free.length ? '이 시간에 ' + free.length + '곳 비어 있음' : '빈 방 없음') + '</span>' +
      (autoTag ? '<span class="auto">자동 선택</span>' : '') +
    '</div>' + rows +
    '<button class="room-row' + (cur ? "" : " on") + '" data-room="none">' +
      '<span class="room-mark">✓</span>' +
      '<span class="room-n">회의실 없이 진행<span class="room-cap">온라인</span></span>' +
    '</button></div>';
}

/* 잡힌 방을 보여주고, 그 자리에서 바꾸게 한다 */
function doneRoomHTML(){
  const h = state.hold;
  if(!h) return "";
  return '<div class="done-rooms">' +
    '<button class="pop-room-btn" id="roomToggle">' +
      (state.roomOpen ? "닫기" : h.room ? "다른 회의실 보기" : "회의실 잡기") + '</button>' +
    (state.roomOpen ? roomsHTML(h, h.people, h.roomId || "none", false) : "") +
  '</div>';
}

/* 방 고르기를 붙인다 — 어디서 눌러도 다시 그린다 */
function bindRooms(root, pick){
  root.querySelectorAll("[data-room]").forEach(b => {
    b.onclick = e => { e.stopPropagation(); pick(b.dataset.room); };
  });
}

/* --------- 3. 결과 --------- */
function renderResults(){
  const slots = state.slots;
  const top = hasTopRank();
  title.textContent = "가능한 일정";

  if(!slots.length){
    /* 애초에 없었던 것과, 물어봤다가 다 거절당한 것은 다른 상황이다 */
    sub.textContent = state.exhausted
      ? "물어본 자리가 모두 어렵다는 답을 받았습니다."
      : "물어볼 만한 시간까지 봤지만 후보가 없습니다.";
    body.innerHTML = state.exhausted
      ? '<div class="banner warn">겹친 분들이 모두 <b>옮기기 어렵다</b>고 답해 후보가 다 빠졌습니다. ' +
        '필수를 줄이거나 범위를 다음다음 주로 넓혀야 합니다.</div>'
      : '<div class="banner warn">어느 자리든 <b>물어볼 사람이 셋 넘게</b> 생깁니다' +
        (state.blockedCount ? ' (' + state.blockedCount + '칸)' : '') + '. ' +
        '필수를 줄이거나 범위를 다음다음 주로 넓혀야 합니다.</div>';
    foot.innerHTML = '<button class="btn ghost" id="backBtn">인원 수정</button>';
    document.getElementById("backBtn").onclick = () => { state.step = 1; render(); };
    return;
  }

  /* 후보 고르기는 AI가 한다 — 주최자는 보낼지 말지를 정한다 */
  if(state.selectedSlot === null) state.selectedSlot = 0;
  const sel = slots[state.selectedSlot];
  const confirmable = sel.rank <= 2;
  const alts = slots.map((s,i) => ({ s, i })).filter(o => o.i !== state.selectedSlot);

  sub.textContent = confirmable
    ? "AI가 고른 시간입니다. 보낼지만 정하시면 됩니다."
    : sel.rank === 5
    ? "앞 순위가 없어, 어려워 보이는 자리까지 후보로 올렸습니다."
    : "전원이 비는 시간이 없어, 물어볼 사람이 가장 적은 시간을 골랐습니다.";

  body.innerHTML =
    (confirmable
      ? '<div class="banner good">전원이 비는 시간을 찾았습니다. 바로 확정 초대가 나갑니다.</div>'
      : sel.rank === 5
      /* 사람이라면 지웠을 자리 — 지우지 않은 이유를 밝힌다 */
      ? '<div class="banner warn"><b>여기는 화면만 보면 안 되는 시간처럼 보입니다.</b> ' +
        '그래도 지우지 않았습니다. 「고객사 방문」도 미리 양해를 구하면 옮겨지고, ' +
        '그 사정은 캘린더에 적혀 있지 않습니다. 물어볼지는 주최자가 정합니다.</div>'
      : '<div class="banner warn"><b>전원이 비는 시간은 없습니다.</b> 여기서 멈추지 않고 ' +
        '<b>혼자 하는 일정과 겹치는 시간</b>까지 봤습니다. ' +
        '“일정이 있다”를 확정된 불가능이 아니라 아직 물어보지 않은 상태로 취급합니다.</div>') +

    '<div class="rec">' +
      '<div class="rec-h"><span class="pill p' + sel.rank + '">' + sel.rank + '순위</span>' +
        '<span class="tag-ai">AI 추천</span></div>' +
      '<div class="rec-when">' + fmt(sel) + '</div>' +
      '<div class="rec-why">' + pickReason(sel, slots) + '</div>' +
      (sel.lowFocus
        ? '<div class="lowfocus-note">점심 직후 — 참석은 되지만 결정의 질이 떨어지는 시간입니다.</div>' : '') +
      conflictHTML(sel) +
      (sel.conflicts.length
        ? '<div class="rec-ask"><b>' + sel.conflicts.map(c => P(c.who).name).join(", ") +
          '</b>에게만 조율 요청이 갑니다. 나머지 ' +
          (state.attendees.length - sel.conflicts.length) + '명에게는 아무 알림도 가지 않습니다.</div>'
        : '') +
      roomsHTML(sel, headCount(), (pickedRoom(sel) || {}).id || "none", !state.room) +
    '</div>' +

    (alts.length
      ? '<button class="alts-toggle" id="altsBtn">' +
          (state.showAlts ? "▾" : "▸") + ' 다른 후보 ' + alts.length + '개</button>' +
        (state.showAlts ? alts.map(o =>
          '<button class="alt-row" data-slot="' + o.i + '">' +
            '<span class="pill p' + o.s.rank + '">' + o.s.rank + '</span>' +
            '<span><span class="alt-when">' + fmt(o.s) + '</span>' +
            '<div class="alt-note">' + slotNote(o.s) + '</div></span>' +
            '<span class="alt-pick">이걸로</span></button>').join("") : "")
      : "");

  const ab = document.getElementById("altsBtn");
  if(ab) ab.onclick = () => { state.showAlts = !state.showAlts; render(); };
  body.querySelectorAll("[data-slot]").forEach(c => {
    c.onclick = () => {
      state.selectedSlot = +c.dataset.slot;
      state.showAlts = false;
      state.room = null;              /* 시간이 바뀌면 빈 방도 달라진다 */
      state.dropped = null;           /* 주최자가 직접 고른 자리다 */
      render();
    };
  });
  bindRooms(body, id => { state.room = id; render(); });
  foot.innerHTML =
    '<button class="btn ghost" id="backBtn">인원 수정</button><div style="flex:1"></div>' +
    '<button class="btn primary" id="sendBtn"' + (sel ? "" : " disabled") + '>' +
      (confirmable ? "초대 + 리마인드 보내기" : "시간 확보 + 조율 요청") + '</button>';
  document.getElementById("backBtn").onclick = () => { state.step = 1; render(); };
  const sn = document.getElementById("sendBtn");
  if(sn) sn.onclick = () => proposeSlot(state.selectedSlot);
}

function slotNote(sl){
  if(sl.rank === 2 && sl.optConflicts.length)
    return "필수 전원 가능 · 선택 " + sl.optConflicts.map(c => P(c.who).name).join(", ") + " 불가";
  if(sl.conflicts.length)
    return sl.conflicts.map(c => P(c.who).name + " 「" + c.block + "」").join(", ");
  return RANK_TEXT[sl.rank];
}

function conflictHTML(sl){
  if(!sl.conflicts.length) return "";
  return '<div class="conflict">' + sl.conflicts.map(c => {
    const p = P(c.who);
    const cls = c.m === "soft" ? "mv-ok" : "soft";
    return '<div class="row">' + avatar(p, 20) + p.name + ' — <span class="blk">「' + c.block + '」</span>' +
      '<span class="flag ' + cls + '">' + MOBILITY_LABEL[c.m] + '</span>' +
      (p.hardToReschedule ? '<span class="flag">놓치면 다시 잡기 어려움</span>' : '') + '</div>';
  }).join("") + '</div>';
}

/* 왜 이 시간을 골랐는지 */
function pickReason(sl, all){
  const fewest = Math.min.apply(null, all.map(s => s.conflicts.length));
  if(sl.rank === 1)
    return "필수·선택 인원이 모두 실제로 비어 있는 시간 중 가장 이른 자리입니다.";
  if(sl.rank === 2)
    return "필수 인원은 모두 가능하고, 선택 인원 " +
      sl.optConflicts.map(c => P(c.who).name).join(", ") + "만 겹칩니다. 물어볼 사람이 없습니다.";
  if(sl.rank === 5)
    return "앞 순위 후보가 없어 여기까지 내려왔습니다. 「" + sl.conflicts[0].block +
      "」은 어려워 보이지만, 물어보기 전에는 모릅니다.";
  return "겹치는 일정이 " + sl.conflicts.length + "건뿐이고, 모두 혼자 하는 일정이라 물어볼 만합니다." +
    (sl.conflicts.length === fewest ? " 후보 중 물어볼 사람이 가장 적습니다." : "");
}

/* --------- 4. 완료 --------- */
/* 왜 이 시간이었는지 — 사람 이름과 실제 일정으로, 최대 세 줄 */
function whyBox(sl){
  const req = required().length + (state.hostJoins ? 1 : 0);
  const names = a => a.map(c => P(c.who).name).join(", ");
  const lines = [];

  if(sl.rank === 1){
    lines.push('그 시간에 <b>' + req + '명 모두</b> 다른 일정이 없습니다.');
    lines.push('아무에게도 일정을 옮겨달라고 하지 않아도 됩니다.');
  }else if(sl.rank === 2){
    lines.push('꼭 와야 하는 <b>' + req + '명</b>은 그 시간이 비어 있습니다.');
    lines.push('<b>' + names(sl.optConflicts) + '</b>님만 다른 일정이 있는데, 안 와도 되는 분이라 그대로 잡았습니다.');
  }else if(sl.rank === 5){
    /* 화면만 보고 지워버리던 자리 — 지우는 대신 맨 뒤에 남겨 물어보게 한다 */
    lines.push('앞 순위 후보가 없어, <b>어려워 보이는 자리</b>까지 내려왔습니다.');
    lines.push('<b>' + names(sl.conflicts) + '</b>님의 <b>「' + sl.conflicts[0].block +
      '」</b>과 겹칩니다. 미리 양해를 구하면 옮겨질 수도 있어, 지우지 않고 남겼습니다.');
  }else{
    lines.push('그 시간에 일정이 있는 사람은 <b>' + names(sl.conflicts) + '</b>님뿐입니다.');
    /* 옮길 수 있는지는 본인만 안다 — 도구는 본 것만 말한다 */
    lines.push('그 일정이 <b>「' + sl.conflicts[0].block + '」</b>이라 물어볼 만하다고 봤습니다. ' +
      '옮길 수 있는지는 본인만 압니다.');
  }

  lines.push('전사 일정으로 막힌 날과 점심시간만 후보에서 뺐습니다. ' +
    '나머지는 순서만 매기고 지우지 않았습니다.');

  return '<div class="why-box"><div class="why-h">왜 이 시간인가요</div><ul>' +
    lines.slice(0, 3).map(l => '<li>' + l + '</li>').join("") + '</ul></div>';
}

function renderDone(){
  const sl = state.slots[state.selectedSlot];
  const askers = sl.conflicts.map(c => P(c.who));
  const held = state.attendees.filter(a => !sl.conflicts.some(c => c.who === a.id));
  const confirmed = state.hold && state.hold.confirmed;

  /* 앞 후보가 왜 빠졌는지 — 한 번 물었다가 접었다는 사실을 남긴다 */
  const dp = state.dropped;
  const dropBanner = dp
    ? '<div class="banner"><b>' + esc(dp.when) + '</b>은 <b>' + esc(dp.who) +
      '</b>님이 「' + esc(dp.block) + '」을 옮기기 어렵다고 해서 빠졌습니다. ' +
      '다음 순위로 넘어왔습니다.</div>'
    : '';

  /* ---------- 1·2순위 또는 조율 성공 → 확정 ---------- */
  if(confirmed){
    const viaAsk = state.sent === "ask";
    const people = state.attendees.length + 1;
    const room = state.hold && state.hold.room;
    title.textContent = "확정 완료";
    sub.textContent = viaAsk
      ? "겹친 일정이 옮겨져서 가예약이 확정으로 바뀌었습니다."
      : "전원이 비는 시간이라 바로 확정했습니다.";
    body.innerHTML = dropBanner +
      '<div class="done-wrap"><div class="done-mark">✓</div>' +
        '<h3>일정이 잡혔습니다</h3>' +
        '<p><b>' + fmt(sl) + '</b> · ' + (room || "회의실 없이 진행") + '<br>' +
          (viaAsk
            ? askers.map(p => p.name).join(", ") + "님이 옮겨줘서 자리가 났습니다."
            : "참석자 " + people + "명에게 초대가 나갔습니다.") + '</p>' +
        doneRoomHTML() +
        whyBox(sl) +
      '</div>';
  }else{
    /* ---------- 3·4순위 → 시간만 확보하고 겹친 사람에게만 묻는다 ---------- */
    title.textContent = askers.map(p => p.name).join(", ") + "님 답을 기다립니다";
    sub.textContent = "답이 오면 그때 확정하고 초대를 보냅니다.";

    const room = state.hold && state.hold.room;

    body.innerHTML = dropBanner +
      '<div class="done-wrap"><div class="done-mark hold">⏳</div>' +
        '<h3>이 시간을 잡아뒀습니다</h3>' +
        '<p><b>' + fmt(sl) + '</b> · ' + (room || "회의실 없이 진행") + '<br>' +
          askers.map((p,i) => '<b>' + p.name + '</b>님께 「' + sl.conflicts[i].block +
            '」을 옮길 수 있는지 물었습니다.').join("<br>") + '<br>' +
          '나머지 ' + held.length + '명에게는 아직 아무 연락도 가지 않았습니다.</p>' +
        doneRoomHTML() +

        (state.holdAnswer === "yes"
          ? '<div class="banner good"><b>' + askers.map(p => p.name).join(", ") +
            '</b>님이 <b>옮길 수 있다</b>고 답했습니다. 이제 확정할 수 있습니다.</div>'
          : state.holdAnswer === "no"
          ? '<div class="banner warn"><b>' + askers.map(p => p.name).join(", ") +
            '</b>님이 <b>옮기기 어렵다</b>고 답했습니다. ' +
            '이 자리는 후보에서 빼고 다음 순위로 넘어갑니다.</div>'
          : '') +

        whyBox(sl) +
      '</div>';
  }

  /* 회의실은 잡은 뒤에도 바꿀 수 있다 */
  const rt = document.getElementById("roomToggle");
  if(rt) rt.onclick = () => { state.roomOpen = !state.roomOpen; render(); };
  bindRooms(body, id => {
    const r = ROOMS.filter(x => x.id === id)[0];
    state.hold.roomId = r ? r.id : null;
    state.hold.room = r ? r.n : null;
    persist(); paintCandidates(); render();
    toast(r ? r.n + "로 바꿨습니다." : "회의실 없이 진행합니다.");
  });

  /* 응답 상태에 따른 주최자의 다음 행동 */
  const ans = state.holdAnswer;

  /* 확정되면 더 고를 것이 없다 — 확인 하나로 끝낸다 */
  foot.innerHTML = confirmed
    ? '<div style="flex:1"></div><button class="btn primary" id="doneBtn">확인</button>'
    : '<button class="btn ghost" id="againBtn">다른 시간으로</button>' +
      '<div style="flex:1"></div>' +
      /* 거절 답이 오면 도구가 알아서 다음 순위로 넘어간다 — 재촉할 버튼이 없다 */
      (ans === "no" ? '<button class="btn primary" id="nextBtn">다음 순위로</button>'
        : ans === "yes" ? '<button class="btn primary" id="confirmBtn">확정하고 전원 초대</button>'
        : '<button class="btn primary" id="doneBtn">완료</button>');

  const ag = document.getElementById("againBtn");
  if(ag) ag.onclick = () => { state.showAlts = true; state.step = 3; render(); };
  const cb = document.getElementById("confirmBtn");
  if(cb) cb.onclick = () => { state.hold.confirmed = true; state.reminders = 0; render(); };
  const nx = document.getElementById("nextBtn");
  if(nx) nx.onclick = dropAndAdvance;
  const db = document.getElementById("doneBtn");
  if(db) db.onclick = () => {
    const done = state.hold && state.hold.confirmed;
    closeSheet();
    toast(done ? "일정이 캘린더에 등록되었습니다." : "확보한 시간이 캘린더에 남아 있습니다.");
  };
}

/* ===================== 시트 열고 닫기 ===================== */
const sheet = document.getElementById("sheet");
const appEl = document.querySelector(".app");
const createBtn = document.getElementById("createBtn");

function showSheet(){
  sheet.classList.add("on"); appEl.classList.add("shifted");
  document.body.classList.add("sheet-open");
}

/* 기본 일정 쪽 초안 — 시간과 옵션은 여기 담긴다 */
function makeDraft(dt, h0){
  const h = h0 != null ? h0 : openHour(dt);
  return {
    key:isoOf(dt), y:dt.getFullYear(), m:dt.getMonth(), day:dt.getDate(),
    d:wdIndex(dt), s:h, e:Math.min(h + 1, END_H),
    meet:false, meetCode:"", roomId:null, roomOpen:false,
    loc:"", desc:"", showLoc:false, showDesc:false,
    busy:true, vis:"def", remind:10, optsOpen:false,
  };
}

/* 만들기 — 두 화면이 하나의 초안을 나눠 쓴다. 기본값은 자동 조율. */
function openSheet(mode, dt0, h0, seedTitle){
  closePop();
  clearTimeout(replyTimer);
  const dt = dt0 || new Date(state.focus);
  state.sent = null; state.selectedSlot = null; state.slots = [];
  state.hold = null; state.reminders = 0; state.holdAnswer = null;
  state.room = null; state.roomOpen = false;
  state.draft = makeDraft(dt, h0);
  if(seedTitle){ state.title = seedTitle; save(); }

  /* 내 캘린더에서 이미 사람을 골라 뒀다면 그 선택을 그대로 이어받는다 */
  /* 주최자는 늘 참석하므로 목록에 넣지 않는다 */
  const visible = PEOPLE.filter(p => !state.hidden[p.id] && p.id !== "me");
  if(visible.length && visible.length < PEOPLE.length - 1){
    state.attendees = visible.map(p => ({ id:p.id, need:"required", from:"calendar" }));
    state.seeded = visible.length;
  }else state.seeded = 0;

  state.sheetOpen = true;
  state.step = mode;
  state.view = "week"; paintViewBtn();
  if(mode === 1 || !dt0) gotoWeek(0);   /* 조율 대상은 다음 주 */
  else repaint();                       /* 고른 시간이 있으면 그 주에 머문다 */
  render();
  onbMark("open");
  if(mode === 1) setTimeout(() => tip("link", ".import-row",
    "회의 이야기가 오간 <b>슬랙 스레드나 노션 문서</b>가 있다면, 여기서 참석자를 한 번에 가져올 수 있습니다.", "left"), 400);
  showSheet();
}
/* 만들기 버튼은 자동 조율로 연다 */
createBtn.onclick = e => { e.stopPropagation(); openSheet(1); };
const openAuto = seedTitle => openSheet(1, null, null, seedTitle);
const openEvent = (dt, h, seedTitle) => openSheet(0, dt, h, seedTitle);
function closeSheet(){
  sheet.classList.remove("on"); appEl.classList.remove("shifted");
  document.body.classList.remove("sheet-open");
  state.step = 1; state.selectedSlot = null; state.sent = null; state.slots = [];
  state.sheetOpen = false;   /* 확보한 시간(state.hold)은 캘린더에 남긴다 */
  state.draft = null;
  clearDraft();
  closePop(); syncGrid(); paintCandidates();
}
document.getElementById("closeSheet").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

let saveTimer = null;
function flashSaved(){
  const f = document.getElementById("saveFlag");
  if(!f) return;
  f.classList.remove("idle");
  f.textContent = "저장 중…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    f.textContent = "자동 저장됨 · 새로고침해도 유지";
    f.classList.add("idle");
  }, 500);
}

/* ===================== 상단바 · 사이드바 ===================== */
const tmenu = document.createElement("div");
tmenu.className = "tmenu";
document.body.appendChild(tmenu);

function openMenu(anchor, html){
  tmenu.innerHTML = html;
  tmenu.classList.add("on");
  const r = anchor.getBoundingClientRect();
  let left = r.left;
  if(left + tmenu.offsetWidth > window.innerWidth - 12) left = window.innerWidth - tmenu.offsetWidth - 12;
  tmenu.style.left = Math.max(12, left) + "px";
  tmenu.style.top = (r.bottom + 6) + "px";
}
function closeMenu(){ tmenu.classList.remove("on"); }
document.addEventListener("click", e => {
  if(!e.target.closest(".tmenu") && !e.target.closest("[data-menu]")) closeMenu();
});
const item = (label, note, on) =>
  '<button class="ti' + (on ? " on" : "") + '">' + label +
  (note ? '<span class="k">' + note + '</span>' : '') + '</button>';

/* 이동 — 보기에 따라 단위가 달라진다 */
function step(dir){
  const f = state.focus;
  if(state.view === "day")        state.focus = addDays(f, dir);
  else if(state.view === "4days") state.focus = addDays(f, dir * 4);
  else if(state.view === "month") state.focus = new Date(f.getFullYear(), f.getMonth() + dir, 1);
  else if(state.view === "year")  state.focus = new Date(f.getFullYear() + dir, 0, 1);
  else if(state.view === "schedule") state.focus = addDays(f, dir * 21);
  else state.focus = addDays(f, dir * 7);
  repaint();
}
document.getElementById("btnPrev").onclick = () => step(-1);
document.getElementById("btnNext").onclick = () => step(1);
document.getElementById("btnToday").onclick = () => { state.focus = new Date(TODAY); repaint(); };

/* 미니 캘린더 월 이동 */
document.getElementById("miniPrev").onclick = () => {
  if(--state.miniMonth < 0){ state.miniMonth = 11; state.miniYear--; }
  paintMini();
};
document.getElementById("miniNext").onclick = () => {
  if(++state.miniMonth > 11){ state.miniMonth = 0; state.miniYear++; }
  paintMini();
};

/* 사이드바 접기 */
document.getElementById("btnMenu").onclick = () => {
  state.sidebar = !state.sidebar;
  document.querySelector(".app").classList.toggle("no-side", !state.sidebar);
  document.body.classList.toggle("no-side", !state.sidebar);
};

/* 섹션 접기 */
[["myCalHead","calList"],["resHead","resList"],["otherCalHead","otherList"]].forEach(pair => {
  const h = document.getElementById(pair[0]), b = document.getElementById(pair[1]);
  h.onclick = () => {
    const closed = h.classList.toggle("closed");

  };
});

/* 다른 캘린더 체크 */
document.querySelectorAll("[data-other]").forEach(r => {
  r.onclick = () => r.classList.toggle("hid");
});

/* 일정 검색 */
const topSearch = document.getElementById("topSearch");
const searchEv = document.getElementById("searchEv");
searchEv.oninput = () => {
  state.query = searchEv.value.trim().toLowerCase();
  topSearch.classList.toggle("has", !!state.query);
  buildGrid(); paintCandidates();
};
document.getElementById("btnSearchX").onclick = () => {
  searchEv.value = ""; state.query = "";
  topSearch.classList.remove("has");
  buildGrid(); paintCandidates();
};

/* 사용자 검색 */
const userSearch = document.getElementById("userSearch");
const userResults = document.getElementById("userResults");
userSearch.oninput = () => {
  const q = userSearch.value.trim().toLowerCase();
  if(!q){ userResults.classList.remove("on"); return; }
  const hits = PEOPLE.filter(p =>
    p.name.toLowerCase().includes(q) || p.email.toLowerCase().includes(q) || p.role.includes(q));
  userResults.innerHTML = hits.length ? hits.map(p =>
    '<button class="res-item" data-uid="' + p.id + '">' + avatar(p) +
      '<span class="meta"><span class="nm">' + p.name + ' · ' + p.role + '</span>' +
      '<span class="em">' + p.email + '</span></span></button>').join("")
    : '<div style="padding:12px;color:var(--text-faint);font-size:12px">검색 결과가 없습니다.</div>';
  userResults.classList.add("on");
  userResults.querySelectorAll("[data-uid]").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.uid;
      PEOPLE.forEach(p => { state.hidden[p.id] = p.id !== id; });
      userSearch.value = ""; userResults.classList.remove("on");
      paintCalList(); buildGrid(); paintCandidates();
    };
  });
};
userSearch.onblur = () => setTimeout(() => userResults.classList.remove("on"), 160);

/* 보기 · 지원 · 설정 · 계정 */
const VIEWS = [
  { k:"day",      n:"일",        key:"D" },
  { k:"week",     n:"주",        key:"W" },
  { k:"month",    n:"월",        key:"M" },
  { k:"year",     n:"연도",      key:"Y" },
  { k:"schedule", n:"일정 목록", key:"A" },
  { k:"4days",    n:"4일",       key:"X" },
];
const VIEW_LABEL = { day:"일", week:"주", month:"월", year:"연도", schedule:"일정 목록", "4days":"4일" };

const btnView = document.getElementById("btnView");
btnView.dataset.menu = "1";
function paintViewBtn(){ btnView.textContent = VIEW_LABEL[state.view] + " ▾"; }

function openViewMenu(){
  openMenu(btnView,
    '<div class="th">보기</div>' +
    VIEWS.map(v => '<button class="ti' + (state.view === v.k ? " on" : "") +
      '" data-view="' + v.k + '">' + v.n +
      '<span class="k">' + (state.view === v.k ? "✓ " : "") + v.key + '</span></button>').join("") +
    '<div class="tsep"></div>' +
    '<button class="ti' + (state.weekend ? " on" : "") + '" data-tg="weekend">주말 표시' +
      '<span class="k">' + (state.weekend ? "✓" : "") + '</span></button>' +
    '<button class="ti' + (state.showDeclined ? " on" : "") + '" data-tg="declined">거절한 일정 표시' +
      '<span class="k">' + (state.showDeclined ? "✓" : "") + '</span></button>');

  tmenu.querySelectorAll("[data-view]").forEach(b => {
    b.onclick = () => { setView(b.dataset.view); closeMenu(); };
  });
  tmenu.querySelectorAll("[data-tg]").forEach(b => {
    b.onclick = () => {
      if(b.dataset.tg === "weekend") state.weekend = !state.weekend;
      else state.showDeclined = !state.showDeclined;
      repaint(); openViewMenu();
    };
  });
}
function setView(v){
  state.view = v;
  paintViewBtn();
  repaint();
  persist();
}
btnView.onclick = openViewMenu;

/* 구글과 같은 보기 단축키 */
document.addEventListener("keydown", e => {
  if(e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
  if(/^(INPUT|TEXTAREA)$/.test((e.target.tagName || "").toUpperCase())) return;
  const v = VIEWS.find(x => x.key === e.key.toUpperCase());
  if(v){ setView(v.k); return; }
  if(e.key === "t" || e.key === "T"){ state.focus = new Date(TODAY); repaint(); }
  if(e.key === "n" || e.key === "j") step(1);
  if(e.key === "p" || e.key === "k") step(-1);
});

const btnHelp = document.getElementById("btnHelp");
btnHelp.dataset.menu = "1";
btnHelp.onclick = () => openMenu(btnHelp,
  item("도움말") + item("학습 센터") + item("업데이트") + '<div class="tsep"></div>' + item("의견 보내기"));

const btnSettings = document.getElementById("btnSettings");
btnSettings.dataset.menu = "1";

const btnAccount = document.getElementById("btnAccount");
btnAccount.dataset.menu = "1";
btnAccount.onclick = () => openMenu(btnAccount,
  '<div class="acct"><span class="avatar-me">정</span>' +
    '<span><div class="nm">정슬기</div><div class="em">seulgi@company.co.kr</div></span></div>' +
  '<div class="tsep"></div>' + item("다른 계정 추가") + item("로그아웃"));

/* ===================== 시작하기 =====================
   긴 투어 대신, 꼭 해봐야 할 것만 체크리스트로 두고
   나머지는 그 화면에 도달했을 때 한 줄 힌트로 알려준다. */
const ONB = [
  { k:"open",   t:"자동 조율 열기",   h:"만들기 → 참석자 추가" },
  { k:"people", t:"참석자 넣기",     h:"슬랙·노션 링크를 붙여넣으면 자동으로" },
  { k:"scan",   t:"가능한 일정 뽑기", h:"물어보면 열릴 시간까지 찾습니다" },
  { k:"send",   t:"조율 요청 보내기", h:"겹친 한 명에게만 갑니다" },
];
const onbEl = document.getElementById("onb");
let onbTimer = null;

/* 언제든 처음부터 다시 해볼 수 있다 */
function onbReset(){
  state.onbDone = {};
  state.tipSeen = {};
  persist();
}

function onbMark(k){
  if(state.onbDone[k]) return;
  state.onbDone[k] = true;
  persist();
  if(state.onbOpen) paintOnb();
}

function paintOnb(){
  const done = ONB.filter(i => state.onbDone[i.k]).length;
  const next = ONB.find(i => !state.onbDone[i.k]);

  if(!next){
    onbEl.innerHTML =
      '<div class="onb-done"><h4>다 해보셨습니다</h4>' +
      '<p>남은 기능은 그 화면에 갔을 때<br>한 줄로 알려드릴게요.</p>' +
      '<button class="onb-again" id="onbAgain">↺ 처음부터 다시</button></div>';
    onbEl.classList.add("on");
    clearTimeout(onbTimer);
    onbTimer = setTimeout(() => {
      state.onbOpen = false;
      btnTour.classList.remove("on");
      onbEl.classList.remove("on");
      persist();
    }, 3600);
    document.getElementById("onbAgain").onclick = () => {
      clearTimeout(onbTimer);
      onbReset();
      paintOnb();
    };
    return;
  }
  clearTimeout(onbTimer);

  onbEl.innerHTML =
    '<div class="onb-h"><span class="t">시작하기</span>' +
      '<span class="n">' + done + ' / ' + ONB.length + '</span>' +
      '<button id="onbClose" title="닫기">✕</button></div>' +
    '<div class="onb-bar"><i style="width:' + (done / ONB.length * 100) + '%"></i></div>' +
    '<div class="onb-list">' + ONB.map(i => {
      const ok = state.onbDone[i.k];
      return '<button class="onb-i' + (ok ? " done" : i === next ? " next" : "") + '" ' +
        (ok ? 'data-redo' : 'data-onb') + '="' + i.k + '">' +
        '<span class="bx">✓</span>' +
        '<span><span class="lb">' + i.t + '</span>' +
        '<span class="hint">' + i.h + '</span></span>' +
        '<span class="go">' + (ok ? "↺ 다시" : "해보기 →") + '</span></button>';
    }).join("") +
    '</div>';
  onbEl.classList.add("on");
  onbEl.querySelectorAll("[data-onb]").forEach(b => {
    b.onclick = () => onbRun(b.dataset.onb);
  });
  onbEl.querySelectorAll("[data-redo]").forEach(b => {
    b.onclick = () => onbRedo(b.dataset.redo);
  });
  document.getElementById("onbClose").onclick = () => {
    state.onbOpen = false;
    btnTour.classList.remove("on");
    onbEl.classList.remove("on");
    persist();
  };
}

btnTour.onclick = () => {
  state.onbOpen = !state.onbOpen;
  btnTour.classList.toggle("on", state.onbOpen);
  if(state.onbOpen){
    /* 이미 다 해본 뒤에 다시 열면 처음부터 */
    if(ONB.every(i => state.onbDone[i.k])) onbReset();
    paintOnb();
  }else{
    clearTimeout(onbTimer);
    onbEl.classList.remove("on");
  }
  persist();
};

/* 어디를 눌러서 이렇게 됐는지 이름표와 함께 짚어준다 */
function flash(sel, label, delay){
  setTimeout(() => {
    const el = document.querySelector(sel);
    if(!el) return;
    const r = el.getBoundingClientRect();
    const br = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 8;
    const n = document.createElement("div");
    n.className = "flash-ring";
    n.style.left = (r.left - 3) + "px";
    n.style.top = (r.top - 3) + "px";
    n.style.width = (r.width + 6) + "px";
    n.style.height = (r.height + 6) + "px";
    n.style.borderRadius = Math.min(br + 3, r.height / 2 + 3) + "px";
    if(label)
      n.innerHTML = '<span class="flash-lb ' + (r.top < 54 ? "down" : "up") + '">' + label + '</span>';
    document.body.appendChild(n);
    setTimeout(() => n.remove(), 2600);
  }, delay || 0);
}

/* 체크리스트 항목을 누르면 그 단계가 실제로 실행된다.
   앞 단계가 안 돼 있으면 거기서부터 이어서 진행한다. */
/* 이름표를 읽을 시간을 준 뒤에 실제로 누른다 */
const READ = 1200;
function ensureSheet(cb){
  if(state.sheetOpen) return cb();
  flash("#createBtn", "만들기 → 참석자 추가");
  setTimeout(() => {
    openAuto();
    setTimeout(cb, 400);
  }, READ);
}
function ensurePeople(cb){
  ensureSheet(() => {
    if(state.attendees.length) return cb();
    state.importOpen = true; render();
    flash(".src-btns", "슬랙에서 스레드 고르기");
    setTimeout(() => startAnalyze(SLACK_URL, RECENT.slack[0].t + " 스레드"), READ);
    setTimeout(cb, READ + 2700);
  });
}
function ensureScan(cb){
  ensurePeople(() => {
    if(state.step === 4) return cb();
    const b = document.getElementById("scanBtn");
    if(!b) return;
    flash("#scanBtn", "가능한 일정 뽑기");
    setTimeout(() => b.click(), READ);
    setTimeout(cb, READ + 1900);
  });
}
/* 이미 해본 단계를 다시 — 그 지점까지 처음부터 되돌린 뒤 실행한다 */
function onbRedo(k){
  closeSheet();
  state.hold = null; state.holdAnswer = null; state.reminders = 0;
  clearTimeout(replyTimer);
  syncGrid(); paintCandidates();
  const from = ONB.findIndex(i => i.k === k);
  ONB.forEach((i, n) => { if(n >= from) state.onbDone[i.k] = false; });
  paintOnb();
  setTimeout(() => onbRun(k), 320);
}

function onbRun(k){
  if(k === "open")   return ensureSheet(() => flash(".sheet-head", "자동 조율이 열렸습니다", 300));
  if(k === "people") return ensurePeople(() => flash(".att", "대화에서 참석자를 찾아왔습니다", 300));
  if(k === "scan")   return ensureScan(() => flash(".done-wrap h3", "AI가 고르고 보냈습니다", 300));
  if(k === "send")   return ensureScan(() => {
    const b = document.getElementById("doneBtn");
    if(!b) return;
    flash("#doneBtn", "완료");
    setTimeout(() => {
      b.click();
      flash(".ev.hold-wait", "캘린더에 잡아둔 시간", 500);
    }, READ);
  });
}

/* ---- 점진적 공개 — 그 자리에 처음 왔을 때만 한 줄 ---- */
const tipEl = document.getElementById("tip");
let tipTimer = null;
function tip(key, sel, html, side){
  if(state.tipSeen[key]) return;
  const el = document.querySelector(sel);
  if(!el) return;
  state.tipSeen[key] = true;
  persist();
  tipEl.innerHTML = html + '<button class="x" id="tipX">✕</button>';
  tipEl.classList.add("on");
  const r = el.getBoundingClientRect();
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = side === "left" ? r.left - w - 12 : r.right + 12;
  if(left < 12 || left + w > window.innerWidth - 12) left = Math.max(12, r.left);
  let top = r.top;
  if(top + h > window.innerHeight - 12) top = window.innerHeight - h - 12;
  tipEl.style.left = Math.max(12, left) + "px";
  tipEl.style.top = Math.max(12, top) + "px";
  document.getElementById("tipX").onclick = hideTip;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(hideTip, 7000);
}
function hideTip(){ tipEl.classList.remove("on"); }
/* 데모 전용 · 화면에 노출하지 않는 단축키.
   Shift+D — 캘린더가 꽉 찬 주 ↔ 여유 있는 주 전환 */
document.addEventListener("keydown", e => {
  if(e.shiftKey && (e.key === "D" || e.key === "d")){
    state.scenario = state.scenario === "B" ? "A" : "B";
    save();
    if(state.step > 1){ state.step = 1; state.slots = []; state.selectedSlot = null; }
    render();
  }
});

/* ===================== 시작 ===================== */
load();
loadPersist();
paintViewBtn();
paintHead();
paintMini();
render();
if(state.onbOpen){ paintOnb(); btnTour.classList.add("on"); }

/* 창 크기가 바뀌면 칸 높이를 다시 맞춘다 */
let fitTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => { buildGrid(); paintCandidates(); }, 120);
});
requestAnimationFrame(() => { buildGrid(); paintCandidates(); });
